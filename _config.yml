theme: jekyll-theme-chirpy

lang: en

title: Hrithik Sawant

tagline: Cloud Native Engineer | Golang | Kubernetes | SRE

description: >
  Personal blog of Hrithik Sawant covering Kubernetes,
  Golang, Linux, DevOps, Site Reliability Engineering,
  observability, homelab experiments, and cloud-native technologies.

url: "https://hrithiksawant.github.io"
baseurl: ""

avatar: /assets/img/avatar.jpg

github:
  username: HrithikSawant

social:
  name: Hrithik Sawant

  links:
    - https://github.com/HrithikSawant
    - https://www.linkedin.com/in/hrithik-sawant


toc: true

actions:
  edit_post:
    enabled: true
    url: https://github.com/HrithikSawant/hrithiksawant.github.io/edit/main
    static_url: false

comments:
  provider:

pwa:
  enabled: true

paginate: 10


jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - scripts
  - tools
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
      dynamic_title: true
